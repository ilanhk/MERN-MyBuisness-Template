services:
  backend:
    container_name: backend
    build:
      context: ./backend_nest
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules # --uncomment this for production
    env_file:
      - ./backend_nest/.env
    environment:
      MONGO_URI: mongodb://db:27017/mybusiness
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
    depends_on:
      - redis
      - db
    networks:
      - app-network

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  db:
    container_name: mongo-db
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
